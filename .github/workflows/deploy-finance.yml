name: Family Finance — test and deploy

# The private finance app lives in finance/ and deploys to its own folder
# (public_html/finance → finance.printsahaj.com). It never touches the website.
on:
  push:
    branches: [main]
    paths:
      - "finance/**"
      - ".github/workflows/deploy-finance.yml"
  pull_request:
    paths:
      - "finance/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: fftest
          MYSQL_USER: ff
          MYSQL_PASSWORD: ffpass
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          extensions: pdo_mysql, curl, mbstring
      - name: Lint PHP
        run: for f in $(find finance -name '*.php'); do php -l "$f" >/dev/null || exit 1; done
      - name: API tests
        env:
          FF_DB_HOST: 127.0.0.1
          FF_DB_NAME: fftest
          FF_DB_USER: ff
          FF_DB_PASS: ffpass
        run: php finance/tests/api_test.php

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A device's browser can hold on to an old cached app.css/app.js long
      # after a deploy (mobile Chrome in particular doesn't offer a hard
      # refresh). Stamp every deploy's commit SHA onto their URLs so a new
      # deploy is always a new URL — no cache, on any device, can ever
      # serve a stale one by mistake.
      - name: Stamp asset URLs with this commit's SHA
        run: |
          set -eu
          SHA="${GITHUB_SHA::7}"
          sed -i "s/assets\/app\.css/assets\/app.css?v=${SHA}/" finance/site/index.html
          sed -i "s/assets\/app\.js/assets\/app.js?v=${SHA}/" finance/site/index.html
          sed -i "s/^const CACHE = '.*';/const CACHE = 'ff-shell-${SHA}';/" finance/site/sw.js
          sed -i "s/assets\/app\.css'/assets\/app.css?v=${SHA}'/" finance/site/sw.js
          sed -i "s/assets\/app\.js'/assets\/app.js?v=${SHA}'/" finance/site/sw.js
      # Same Hostinger FTP account as the website; that user is jailed to
      # public_html, so "finance/" is public_html/finance. The real config
      # (with the database password) sits above public_html and is never
      # uploaded or deleted by this step.
      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: finance/site/
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}finance/
          state-name: .ftp-deploy-sync-state-finance.json
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            config.php
      - name: Check the app answers and hides its source
        # Hostinger's bot/WAF filter (Imunify360) sometimes 403s a plain
        # curl request with no browser-like headers, even though real
        # visitors load the page fine. A believable User-Agent and Accept
        # header, plus one retry, avoids that false alarm without hiding
        # a real outage (a real 403/down state persists across retries).
        run: |
          set -eu
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36'
          fetch_code() {
            local url="$1" out="${2:-/dev/null}"
            for attempt in 1 2 3; do
              code=$(curl -sS -o "$out" -w "%{http_code}" --max-time 30 -A "$UA" -H 'Accept: text/html' "$url")
              [ "$code" = "403" ] && [ "$attempt" -lt 3 ] && sleep 5 && continue
              break
            done
            echo "$code"
          }
          code=$(fetch_code https://finance.printsahaj.com/ /tmp/ff.html)
          echo "App HTTP $code"; [ "$code" = "200" ] && grep -q "Family Finance" /tmp/ff.html
          src=$(fetch_code https://finance.printsahaj.com/src/lib.php)
          echo "Source HTTP $src"; [ "$src" = "404" ] || [ "$src" = "403" ]
          main=$(fetch_code https://printsahaj.com/finance/)
          echo "printsahaj.com/finance/ HTTP $main"; [ "$main" = "404" ] || [ "$main" = "403" ]
