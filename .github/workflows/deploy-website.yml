name: Deploy website to Hostinger

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:
    inputs:
      diagnose:
        description: "Read-only: print the FTP login directory and compare relative vs absolute listings, then stop"
        type: boolean
        default: false
      dry_run:
        description: "Build, then print what the full-site mirror WOULD upload/delete. Uploads and deletes nothing"
        type: boolean
        default: false

# One deploy at a time: a second push queues behind the running one instead of
# racing it on the same remote folder (and is never cancelled mid-upload).
concurrency:
  group: deploy-website
  cancel-in-progress: false

# Settings used by EVERY lftp call (diagnose, deploy, dry run, cleanup). Without
# them lftp 4.9.2 waits 5 minutes per attempt and retries ~1000 times, so a
# listing that stalls (run #33) looks like an endless hang. Plain FTP is the
# default: it is what the old working FTP-Deploy-Action used from GitHub runners.
# Set the repo variable FTP_TLS to exactly `true` to switch to explicit FTPS.
env:
  LFTP_BASE: >-
    set net:timeout 20; set net:max-retries 2; set net:reconnect-interval-base 5;
    set net:reconnect-interval-multiplier 1; set ftp:passive-mode on; set ftp:prefer-epsv no;
    set dns:order "inet inet6"; set ftp:ssl-allow no

# Why lftp and not FTP-Deploy-Action (what went wrong in run #31):
# every Next build has a new buildId, so every deploy must delete the previous
# _next/static/<oldBuildId>/ folder. FTP-Deploy-Action tolerates a missing FILE
# on delete but not a missing FOLDER, and removes folders by ABSOLUTE path
# ("/_next/static/<id>") while every upload uses a path relative to the login
# directory. When the FTP account's root is not the web root, that absolute path
# does not exist: "550 No such file or directory", after everything was uploaded.
# It is deterministic, so the old retry step could never help, and the sync state
# is only written after a full success, so every later deploy diffed against the
# same stale state and failed the same way.
# lftp mirror computes its deletes from a live listing of the server (no state
# file) and works relative to the login directory, so a folder that is already
# gone is simply not in the plan, and a re-run converges.

jobs:
  # Read-only. Run from the Actions tab: "Run workflow" -> diagnose = true.
  # Nothing here writes to the server: no put/mirror/rm/mkdir/mv/chmod/site, and
  # `quote` only sends PWD and SYST. (lftp's own `pwd` never contacts the server
  # and prints the connection URL including the password, so it is not used.)
  diagnose:
    if: ${{ inputs.diagnose }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Show the FTP login directory and listings
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_TLS: ${{ vars.FTP_TLS }}
        run: |
          set -uo pipefail
          PRE="$LFTP_BASE"
          if [ "${FTP_TLS:-}" = "true" ]; then
            PRE="${PRE//set ftp:ssl-allow no/set ftp:ssl-allow yes; set ftp:ssl-force yes; set ftp:ssl-protect-data yes; set ssl:verify-certificate no}"
          fi
          out="${RUNNER_TEMP:-/tmp}"
          rm -f "$out/rel.txt" "$out/abs.txt" "$out/top.txt"

          # $1 = extra settings, $2 = commands. Non-interactive (stdin from /dev/null), password via env, hard 240s cap.
          ftp() {
            LFTP_PASSWORD="$FTP_PASSWORD" timeout 240 lftp -c "$PRE; $1; open -u \"$FTP_USERNAME\" --env-password \"$FTP_SERVER\"; $2; bye" < /dev/null
            local rc=$?
            if [ "$rc" = "124" ]; then
              echo "::error::lftp timed out after 240s (see the debug lines above for the last server reply)"
            fi
            return "$rc"
          }

          echo "== connect (debug 3 shows server replies, never the password), server login directory, system =="
          ftp "debug 3; set cmd:fail-exit yes" "quote PWD; quote SYST; cls -1 _next/static/ > $out/rel.txt"
          rc_rel=$?
          if [ "$rc_rel" != "0" ]; then
            echo "::error::Could not log in and list the server (exit $rc_rel). The other listings would fail the same way, so the run stops here. Check FTP_SERVER / credentials, or set the repo variable FTP_TLS to true if the host requires FTPS."
            exit "$rc_rel"
          fi
          echo "== absolute listing (a 550 here is the expected diagnosis, not a failure) =="
          ftp "set cmd:fail-exit no" "cls -1 /_next/static/ > $out/abs.txt"
          echo "== top level of the login directory (look for subdomain/addon folders and Hostinger files) =="
          ftp "set cmd:fail-exit no" "cls -1a > $out/top.txt"

          echo
          echo "--- relative _next/static/ (first 20) ---"; head -20 "$out/rel.txt" 2>/dev/null
          echo "--- absolute /_next/static/ (first 5) ---"; head -5 "$out/abs.txt" 2>/dev/null
          echo "--- relative top level (first 60) ---"; head -60 "$out/top.txt" 2>/dev/null
          echo
          # lftp prints the absolute listing with a leading "/": compare without it.
          if cmp -s <(sed 's#^/##' "$out/rel.txt" 2>/dev/null) <(sed 's#^/##' "$out/abs.txt" 2>/dev/null); then
            echo "RESULT: relative and absolute listings are the SAME: the FTP root is the web root."
          else
            echo "RESULT: relative and absolute listings DIFFER: the FTP root is not the web root (absolute paths such as /_next/... do not exist). That is the 550."
          fi
          exit "$rc_rel"

  deploy:
    if: ${{ !inputs.diagnose }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build static site
        working-directory: web
        run: npm run build

      # A missing index.html is the one failure FTP cannot report, so catch it
      # here rather than after a two-minute upload into a live site.
      - name: Check the export looks right
        working-directory: web
        run: |
          test -f out/index.html || { echo "out/index.html missing"; exit 1; }
          test -f out/.htaccess || { echo "out/.htaccess missing"; exit 1; }
          test -f out/tools/index.html || { echo "route folders have no index.html — is trailingSlash still set?"; exit 1; }

      # Next.js creates an EMPTY out/_next/<buildId>/ folder on every build (the
      # real per-build files live in out/_next/static/<buildId>/). FTP never
      # creates empty dirs, so mirroring them only adds noise. Remove them here.
      - name: Remove empty directories from the export
        working-directory: web
        run: |
          echo "Empty directories being removed:"
          find out -mindepth 1 -type d -empty -print
          find out -mindepth 1 -type d -empty -delete
          # Deleting can empty a parent; repeat until nothing is left.
          while [ -n "$(find out -mindepth 1 -type d -empty -print -quit)" ]; do
            find out -mindepth 1 -type d -empty -delete
          done
          test -z "$(find out -type d -empty -print -quit)" || { echo "empty dirs remain"; exit 1; }

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # The Hostinger FTP user is jailed to public_html, so "." is the website
      # root (uploading to /public_html/ again would nest a second folder).
      # FTP_SERVER_DIR can still override if an account differs.
      #
      # Two passes so new hashed assets are on the server before any HTML points
      # at them: (1) _next/ without delete, (2) the whole site WITH delete. The
      # delete list comes from the live remote listing. Up to two attempts: a
      # mirror re-run is idempotent, so the second only does what is left.
      # dry_run: pass 2 only, with --dry-run; prints the plan, changes nothing.
      # continue-on-error: the job is judged by the verification step below.
      - name: Deploy to Hostinger via lftp mirror
        id: deploy
        continue-on-error: true
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_SERVER_DIR || '.' }}
          DRY_RUN: ${{ inputs.dry_run }}
          # Optional repo variable (Settings > Variables): extra space-separated globs to protect
          # on the server, e.g. "subdomain/ addon.example.com/" (confirm with the dry run).
          EXTRA_EXCLUDES: ${{ vars.FTP_EXTRA_EXCLUDES }}
          FTP_TLS: ${{ vars.FTP_TLS }}
        run: |
          set -uo pipefail
          PRE="$LFTP_BASE"
          if [ "${FTP_TLS:-}" = "true" ]; then
            PRE="${PRE//set ftp:ssl-allow no/set ftp:ssl-allow yes; set ftp:ssl-force yes; set ftp:ssl-protect-data yes; set ssl:verify-certificate no}"
          fi
          # $1 = extra settings, $2 = commands, $3 = seconds cap. Non-interactive (stdin from /dev/null), password via env, always ends with bye.
          ftp() {
            LFTP_PASSWORD="$FTP_PASSWORD" timeout "$3" lftp -c "$PRE; $1; open -u \"$FTP_USERNAME\" --env-password \"$FTP_SERVER\"; $2; bye" < /dev/null
          }

          # Never delete: hosting-managed files and folders.
          EXCLUDES="--exclude-glob .well-known/ --exclude-glob cgi-bin/ --exclude-glob .ftp-deploy-sync-state* --exclude-glob .user.ini --exclude-glob .htpasswd --exclude-glob default.php --exclude-glob error_log"
          # Files that may live on the server but are not part of this export. If the
          # export ships one (e.g. a robots.txt), it is uploaded and managed normally.
          for pat in "google*.html" "robots.txt" "sitemap*.xml"; do
            compgen -G "web/out/$pat" > /dev/null || EXCLUDES="$EXCLUDES --exclude-glob $pat"
          done
          # Extra protected globs (repo variable FTP_EXTRA_EXCLUDES): space OR comma separated.
          # set -f: no pathname expansion, so "*/" or ".*" stay literal globs for lftp
          # (unquoted, they expanded to web/ and .github on the runner).
          set -f
          EXTRA_EXCLUDES=${EXTRA_EXCLUDES//,/ }
          for g in $EXTRA_EXCLUDES; do EXCLUDES="$EXCLUDES --exclude-glob $g"; done
          set +f
          echo "Protected from --delete: $EXCLUDES"
          SETTINGS="set cmd:fail-exit yes"
          SITE="mirror --reverse --delete --no-perms --parallel=4 --verbose $EXCLUDES web/out/ $FTP_DIR/"

          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY RUN: planned changes for the whole site (nothing is uploaded or deleted)."
            echo "Review every 'rm' / 'rmdir' line: only old site files may appear."
            ftp "$SETTINGS" "${SITE/mirror /mirror --dry-run }" 600
            exit $?
          fi

          ok=0
          for i in 1 2; do
            echo "== attempt $i =="
            if ftp "$SETTINGS" "mirror --reverse --no-perms --parallel=4 --verbose web/out/_next/ $FTP_DIR/_next/; $SITE" 600; then
              ok=1
              break
            fi
            echo "attempt $i failed"
            sleep 20
          done
          [ "$ok" = "1" ] || exit 1

          # Retire the old FTP-Deploy-Action state files (they list the whole site). rm -f must never fail the step.
          ftp "set cmd:fail-exit no" "rm -f $FTP_DIR/.ftp-deploy-sync-state.json $FTP_DIR/.ftp-deploy-sync-state-v2.json $FTP_DIR/.ftp-deploy-sync-state-v3.json" 60 || true

      # The only thing that decides whether the job is green. Not for dry runs.
      - name: Verify the live site
        id: verify
        if: ${{ !cancelled() && !inputs.dry_run }}
        run: |
          set -uo pipefail
          fail=0

          code=$(curl -sS -o /tmp/home.html -w "%{http_code}" --max-time 30 https://printsahaj.com/ || echo 000)
          echo "Homepage HTTP $code"
          if [ "$code" != "200" ]; then
            echo "printsahaj.com returned HTTP $code. FTP_SERVER_DIR is likely not the domain document root in hPanel."
            fail=1
          elif ! grep -qi "printsahaj" /tmp/home.html; then
            echo "Homepage did not contain PrintSahaj"
            fail=1
          fi

          # Proves this build's assets are live: one CSS and one JS chunk named in the local index.html.
          css=$(grep -oE '/_next/static/chunks/[^"]+\.css' web/out/index.html | head -1)
          # ...and that the LIVE homepage points at this build's CSS (a half-finished deploy still serves old HTML).
          if [ -n "$css" ] && ! grep -qF "$css" /tmp/home.html; then
            echo "Live homepage does not reference this build's CSS ($css): the deploy is half-finished."
            fail=1
          fi
          js=$(grep -oE '/_next/static/chunks/[^"]+\.js' web/out/index.html | head -1)
          for path in "$css" "$js"; do
            [ -n "$path" ] || { echo "no asset path found in web/out/index.html"; fail=1; continue; }
            c=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 "https://printsahaj.com$path" || echo 000)
            echo "$path -> HTTP $c"
            [ "$c" = "200" ] || fail=1
          done

          # The deploy state file must answer 403 or 404 (not 200, not 500).
          s=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 https://printsahaj.com/.ftp-deploy-sync-state-v3.json || echo 000)
          echo "state file -> HTTP $s"
          if [ "$s" != "403" ] && [ "$s" != "404" ]; then
            echo "Expected 403 or 404 for the deploy state file, got $s (200 = publicly readable, 500 = broken rule)."
            fail=1
          fi

          exit $fail

      - name: Note an FTP error that the live site survived
        if: ${{ !cancelled() && !inputs.dry_run && steps.deploy.outcome == 'failure' && steps.verify.outcome == 'success' }}
        run: echo "::warning::FTP sync reported an error but the live site verifies"

      # continue-on-error keeps a failed dry run's job green, which hides it.
      # Make it visible: a dry run whose listing failed must not look fine.
      - name: Fail if the dry run failed
        if: ${{ inputs.dry_run && steps.deploy.outcome == 'failure' }}
        run: |
          echo "::error::The dry run failed. Read the 'Deploy to Hostinger via lftp mirror' step log."
          exit 1
