name: Deploy website to Hostinger

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build static site
        working-directory: web
        run: npm run build

      # A missing index.html is the one failure FTP cannot report, so catch it
      # here rather than after a two-minute upload into a live site.
      - name: Check the export looks right
        working-directory: web
        run: |
          test -f out/index.html || { echo "out/index.html missing"; exit 1; }
          test -f out/.htaccess || { echo "out/.htaccess missing"; exit 1; }
          test -f out/tools/index.html || { echo "route folders have no index.html — is trailingSlash still set?"; exit 1; }

      # This Hostinger FTP user is already jailed to public_html ("Folder to
      # upload files" in hPanel). Uploading to /public_html/ again nests a
      # second folder and the live site stays empty (403). "./" is the
      # website root. FTP_SERVER_DIR can still override if an account differs.
      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: web/out/
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      # A successful FTP sync can still land in the wrong Hostinger folder.
      # Fail the job if the live homepage is not a real page.
      - name: Check the live homepage
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/home.html -w "%{http_code}" --max-time 30 https://printsahaj.com/)
          echo "Homepage HTTP $code"
          if [ "$code" != "200" ]; then
            echo "printsahaj.com returned HTTP $code. FTP_SERVER_DIR is likely not the domain document root in hPanel."
            exit 1
          fi
          grep -qi "printsahaj" /tmp/home.html || {
            echo "Homepage did not contain PrintSahaj"
            exit 1
          }
