name: Deploy artwork verification tool to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - "tools/artwork-verification/engine/**"
      - ".github/workflows/deploy-artwork-tool.yml"
  workflow_dispatch:

env:
  PROJECT_ID: printsahaj
  REGION: asia-south1
  SERVICE: artwork-verification
  IMAGE: asia-south1-docker.pkg.dev/printsahaj/cloud-run-source-deploy/artwork-verification:latest

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        working-directory: tools/artwork-verification/engine
        run: gcloud builds submit --project=${{ env.PROJECT_ID }} --tag=${{ env.IMAGE }} --suppress-logs .

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --project=${{ env.PROJECT_ID }} \
            --region=${{ env.REGION }} \
            --image=${{ env.IMAGE }}
