name: Deploy artwork verification tool to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - "tools/artwork-verification/engine/**"
      - ".github/workflows/deploy-artwork-tool.yml"
  workflow_dispatch:

env:
  PROJECT_ID: printsahaj
  REGION: asia-south1
  SERVICE: artwork-verification
  IMAGE: asia-south1-docker.pkg.dev/printsahaj/cloud-run-source-deploy/artwork-verification:latest

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Streaming Cloud Build logs needs project Viewer; submit async and poll status instead.
      - name: Build and push image
        working-directory: tools/artwork-verification/engine
        run: |
          BUILD_ID=$(gcloud builds submit --project=${{ env.PROJECT_ID }} --tag=${{ env.IMAGE }} --async --format='value(id)' .)
          echo "Build: $BUILD_ID"
          while true; do
            STATUS=$(gcloud builds describe "$BUILD_ID" --project=${{ env.PROJECT_ID }} --format='value(status)')
            echo "Status: $STATUS"
            case "$STATUS" in
              SUCCESS) break ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED) exit 1 ;;
            esac
            sleep 10
          done

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --project=${{ env.PROJECT_ID }} \
            --region=${{ env.REGION }} \
            --image=${{ env.IMAGE }}
