<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PrintSahaj · PrintVerify</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap"
    rel="stylesheet"
  />
  <style>
    /* -----------------------------------------------------------------------
       PrintVerify desk. The palette is the printsahaj.com night sky, so the
       tool and the site read as one product. Dark chrome is also the right
       call for judging artwork: a light surround biases how you read colour.
       ----------------------------------------------------------------------- */
    :root {
      color-scheme: dark;

      --bg-base: #0a0b0d;
      --bg-raised: #101217;
      --bg-sunken: #060708;
      --surface: rgba(255, 255, 255, 0.035);
      --surface-hover: rgba(255, 255, 255, 0.065);

      --line: rgba(255, 255, 255, 0.10);
      --line-hover: rgba(255, 255, 255, 0.20);

      --ink: #f1f3f6;
      --muted: #98a1ab;
      --faint: #69727c;

      /* Process inks — the brand, and literally what this tool inspects. */
      --cyan: #22d3ee;
      --magenta: #ec4899;
      --yellow: #f5c542;
      --violet: #8b7cf6;

      --accent: #14b8a6;
      --accent-hover: #2dd4bf;
      --accent-line: rgba(20, 184, 166, 0.45);

      /* Verdicts. Red is reserved for a definite problem so it never has to
         compete with a maybe. */
      --clear: #34d399;
      --judge: #fbbf24;
      --issue: #ff6152;
      --wait: #868f99;
      --clear-wash: rgba(52, 211, 153, 0.12);
      --judge-wash: rgba(251, 191, 36, 0.12);
      --issue-wash: rgba(255, 97, 82, 0.13);
      --wait-wash: rgba(255, 255, 255, 0.06);

      --font-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
      --font-body: "Inter", "Segoe UI", system-ui, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;

      --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.4);
      --shadow-lift: 0 12px 32px rgba(0, 0, 0, 0.45);
      --shadow-modal: 0 32px 80px rgba(0, 0, 0, 0.65);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg-base);
      color: var(--ink);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    /* A faint ink wash in the corners, the same trick the site's hero uses. */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(60vw 50vh at 12% -10%, rgba(34, 211, 238, 0.07), transparent 70%),
        radial-gradient(50vw 40vh at 100% 0%, rgba(139, 124, 246, 0.06), transparent 70%);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 24px;
      padding-right: 260px;
      border-bottom: 1px solid var(--line);
      background: rgba(10, 11, 13, 0.82);
      backdrop-filter: blur(12px);
    }
    header p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      border-left: 1px solid var(--line);
      padding-left: 16px;
    }
    h1 {
      margin: 0;
      font-family: var(--font-display);
      font-size: 19px;
      letter-spacing: -0.02em;
      font-weight: 700;
    }
    h2 {
      font-family: var(--font-display);
      font-size: 24px;
      letter-spacing: -0.02em;
      font-weight: 700;
      margin: 18px 0 6px;
    }
    .kicker {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
    }
    /* The dot pips echo the CMYK mark in the site's logo. */
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-pips { display: flex; }
    .brand-pips i {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      display: block;
      mix-blend-mode: screen;
    }
    .brand-pips i:nth-child(1) { background: var(--cyan); }
    .brand-pips i:nth-child(2) { background: var(--magenta); margin-left: -4px; }
    .brand-pips i:nth-child(3) { background: var(--yellow); margin-left: -4px; }

    main { max-width: 1180px; margin: 0 auto; padding: 28px 24px 64px; }
    main > section { animation: rise 0.28s ease both; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } }

    button, .btn {
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 600;
      background: linear-gradient(180deg, var(--accent-hover), var(--accent));
      color: #04201c;
      border: 0;
      border-radius: 999px;
      padding: 10px 20px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }
    button:hover, .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(20, 184, 166, 0.28); }
    button.ghost, .btn.ghost {
      background: var(--surface);
      color: var(--ink);
      border: 1px solid var(--line);
    }
    button.ghost:hover, .btn.ghost:hover {
      background: var(--surface-hover);
      border-color: var(--line-hover);
      box-shadow: none;
    }
    button.danger { background: transparent; color: var(--issue); border: 1px solid rgba(255, 97, 82, 0.35); }
    button.danger:hover { background: var(--issue-wash); box-shadow: none; }
    button:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: none; }
    :focus-visible { outline: 2px solid var(--accent-hover); outline-offset: 2px; border-radius: 4px; }

    input, textarea, select {
      width: 100%;
      padding: 11px 13px;
      margin: 6px 0 16px;
      border: 1px solid var(--line);
      border-radius: 10px;
      font: 15px var(--font-body);
      background: var(--bg-sunken);
      color: var(--ink);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--accent-line);
      box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.14);
    }
    input::placeholder, textarea::placeholder { color: var(--faint); }
    /* Job codes and artwork names are data, so they read as data. */
    #job_id, #file_name { font-family: var(--font-mono); }
    label {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 600;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px 20px;
      margin: 12px 0;
      box-shadow: var(--shadow-card);
    }
    .row { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
    .err { color: var(--issue); font-size: 14px; }
    .err:empty { display: none; }
    .muted { color: var(--muted); font-size: 13px; }
    .review-row .muted { white-space: pre-wrap; }
    .review-row.issue strong { color: var(--issue); }
    .review-row.judge strong { color: var(--judge); }
    .review-row.clear strong { color: var(--clear); }
    .text-block .bad { color: var(--issue); font-weight: 600; }
    .text-block {
      max-height: 220px;
      overflow-y: auto;
      white-space: pre-wrap;
      background: var(--bg-sunken);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 14px;
      margin-top: 10px;
      font-family: var(--font-mono);
      font-size: 12.5px;
      line-height: 1.6;
      color: var(--muted);
    }

    .top-actions {
      position: fixed;
      top: 11px;
      right: 20px;
      z-index: 40;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .lang-pick {
      width: auto;
      margin: 0;
      padding: 8px 12px;
      font-size: 13px;
      background: var(--bg-raised);
      border-radius: 999px;
    }
    .hidden { display: none; }

    .preview {
      max-width: 100%;
      max-height: 280px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--bg-sunken);
      display: block;
      cursor: zoom-in;
      transition: border-color 0.15s ease, transform 0.15s ease;
    }
    .preview:hover { border-color: var(--accent-line); transform: scale(1.005); }
    .uploading {
      color: var(--accent-hover);
      font-weight: 600;
      font-size: 13px;
      margin: 12px 0 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .uploading::before {
      content: "";
      width: 13px;
      height: 13px;
      border-radius: 50%;
      border: 2px solid rgba(45, 212, 191, 0.25);
      border-top-color: var(--accent-hover);
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* Empty slot: a dashed drop-target reads as "something goes here". */
    .slot-empty {
      margin: 12px 0 0;
      padding: 22px 16px;
      border: 1px dashed var(--line-hover);
      border-radius: 12px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      background: rgba(255, 255, 255, 0.015);
    }
    .compare-pick {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
      margin: 12px 0 10px;
      cursor: pointer;
      padding: 5px 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      transition: border-color 0.15s ease, color 0.15s ease;
    }
    .compare-pick:hover { border-color: var(--line-hover); color: var(--ink); }
    .compare-pick:has(input:checked) { border-color: var(--accent-line); color: var(--accent-hover); }
    .compare-pick input { width: auto; margin: 0; accent-color: var(--accent); }

    .viewer-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .viewer-grid.one { grid-template-columns: 1fr; }
    .viewer-toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
    .viewer-toolbar button { padding: 7px 13px; font-size: 13px; }
    .viewer-stage {
      position: relative;
      overflow: auto;
      /* Neutral near-black: the artwork is the only colour in this box. */
      background: #0b0c0e;
      border: 1px solid var(--line);
      min-height: 0;
      height: calc(100vh - 150px);
      border-radius: 12px;
    }
    .viewer-img { display: block; transform-origin: top left; }
    .loupe {
      position: absolute;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.7);
      pointer-events: none;
      background-repeat: no-repeat;
    }
    .loupe-btn.active { border-color: var(--accent-line); color: var(--accent-hover); background: var(--surface-hover); }
    .preview-nav { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
    .preview-nav button { padding: 6px 12px; font-size: 13px; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }

    /* The stepper is the product's spine: approval → vendor plates → print,
       each gated on the one before. Numbers come from a CSS counter so the
       markup stays as the renderer writes it. */
    .stepper {
      display: flex;
      gap: 10px;
      margin: 18px 0 28px;
      counter-reset: step;
    }
    .step {
      flex: 1;
      position: relative;
      padding: 15px 16px 15px 52px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      text-align: left;
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 700;
      transition: border-color 0.18s ease, background 0.18s ease, transform 0.18s ease;
    }
    .step::before {
      counter-increment: step;
      content: counter(step);
      position: absolute;
      left: 15px;
      top: 15px;
      width: 25px;
      height: 25px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--wait-wash);
      border: 1px solid var(--line);
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease;
    }
    /* Connector between steps, so the sequence reads as a path. */
    .step + .step::after {
      content: "";
      position: absolute;
      left: -10px;
      top: 27px;
      width: 10px;
      height: 1px;
      background: var(--line);
    }
    .step:hover:not(.locked):not(.active) { border-color: var(--line-hover); transform: translateY(-1px); }
    .step.done::before {
      content: "✓";
      background: var(--clear-wash);
      border-color: rgba(52, 211, 153, 0.4);
      color: var(--clear);
    }
    .step.active {
      border-color: var(--accent-line);
      background: linear-gradient(180deg, rgba(20, 184, 166, 0.12), rgba(20, 184, 166, 0.04));
      box-shadow: 0 0 0 1px var(--accent-line), 0 8px 24px rgba(20, 184, 166, 0.12);
    }
    .step.active::before { background: var(--accent); border-color: transparent; color: #04201c; }
    .step.locked { opacity: 0.42; cursor: not-allowed; }
    .step.locked::before { content: "🔒"; font-size: 10px; background: transparent; border-color: transparent; }
    .step small {
      display: block;
      color: var(--muted);
      margin-top: 4px;
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 400;
      line-height: 1.45;
    }

    /* A finding is the thing this product sells. Red gets a tinted panel and
       a bar down the side so a definite problem cannot be skimmed past. */
    .review-row {
      display: grid;
      grid-template-columns: 36px 1fr;
      gap: 14px;
      padding: 14px 0;
      border-top: 1px solid var(--line);
      font-size: 14px;
      align-items: start;
    }
    .review-row.issue {
      background: var(--issue-wash);
      border-left: 3px solid var(--issue);
      border-radius: 0 10px 10px 0;
      padding: 14px 16px;
      margin-top: 8px;
    }
    .review-row.judge { border-left: 3px solid rgba(251, 191, 36, 0.5); padding-left: 13px; }
    .tick {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 15px;
      border: 1px solid transparent;
    }
    .tick.clear { background: var(--clear-wash); color: var(--clear); border-color: rgba(52, 211, 153, 0.35); }
    .tick.issue { background: rgba(255, 97, 82, 0.2); color: var(--issue); border-color: rgba(255, 97, 82, 0.5); }
    .tick.judge { background: var(--judge-wash); color: var(--judge); border-color: rgba(251, 191, 36, 0.35); }
    .tick.wait, .tick.eye { background: var(--wait-wash); color: var(--wait); border-color: var(--line); }

    /* Job list */
    #job-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; margin-top: 16px; }
    #job-list .card { margin: 0; }
    .job-card { cursor: pointer; transition: border-color 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease; }
    .job-card strong { font-family: var(--font-mono); font-size: 15px; letter-spacing: -0.01em; }
    .job-card:hover {
      border-color: var(--accent-line);
      transform: translateY(-2px);
      box-shadow: var(--shadow-lift);
    }
    .job-card .open-hint { color: var(--accent-hover); font-size: 13px; font-weight: 600; }

    .pick-wrap { position: relative; }
    .file-pick {
      position: absolute;
      width: 0;
      height: 0;
      opacity: 0;
      pointer-events: none;
    }

    .modal-back {
      position: fixed;
      inset: 0;
      background: rgba(4, 5, 6, 0.72);
      backdrop-filter: blur(6px);
      display: none;
      align-items: flex-start;
      justify-content: center;
      padding: 48px 16px;
      z-index: 20;
      pointer-events: none;
    }
    .modal-back.is-open {
      display: flex;
      pointer-events: auto;
      animation: fade 0.2s ease both;
    }
    @keyframes fade { from { opacity: 0; } }
    .modal-back[hidden] {
      display: none !important;
      pointer-events: none !important;
    }
    .modal {
      background: var(--bg-raised);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow-modal);
      max-width: 680px;
      width: 100%;
      max-height: calc(100vh - 96px);
      overflow: auto;
      padding: 22px 24px 28px;
      animation: rise 0.24s ease both;
    }
    .modal-back.viewer-open {
      padding: 8px;
      align-items: stretch;
    }
    .modal.viewer-modal {
      max-width: calc(100vw - 16px);
      width: calc(100vw - 16px);
      max-height: calc(100vh - 16px);
      height: calc(100vh - 16px);
      padding: 12px 16px 14px;
      display: flex;
      flex-direction: column;
    }
    .modal.viewer-modal .viewer-grid { flex: 1; min-height: 0; }

    @media (max-width: 720px) {
      header { padding-right: 24px; flex-wrap: wrap; }
      header p { display: none; }
      .top-actions { position: static; justify-content: flex-end; padding: 10px 16px 0; }
      .stepper { flex-direction: column; }
      .step + .step::after { display: none; }
      main { padding: 20px 16px 48px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="top-actions">
    <button type="button" class="ghost" id="signout-btn" hidden>Sign out</button>
    <select class="lang-pick" data-lang-pick aria-label="Language"></select>
  </div>
  <section id="login-view" class="hidden" style="max-width:380px;margin:14vh auto;padding:0 16px;">
    <div class="brand" style="margin-bottom:18px">
      <span class="brand-pips" aria-hidden="true"><i></i><i></i><i></i></span>
      <div>
        <div class="kicker">PrintSahaj</div>
        <h1>PrintVerify</h1>
      </div>
    </div>
    <p class="muted" style="margin-bottom:22px">Sign in to open the desk.</p>
    <label>Email</label>
    <input id="login-email" type="email" autocomplete="username" />
    <label>Password</label>
    <input id="login-password" type="password" autocomplete="current-password" />
    <p id="login-err" class="err"></p>
    <button type="button" id="login-btn">Sign in</button>
  </section>
  <div id="app-root" class="hidden">
  <header>
    <div class="brand">
      <span class="brand-pips" aria-hidden="true"><i></i><i></i><i></i></span>
      <div>
        <div class="kicker">PrintSahaj</div>
        <h1>PrintVerify</h1>
      </div>
    </div>
    <p id="desk-hint">First approval, then vendor plates, then print.</p>
  </header>
  <main>
    <section id="list-view">
      <div class="row">
        <strong>Jobs</strong>
        <div>
          <button type="button" class="danger" id="clear-btn">Delete all jobs</button>
          <button type="button" id="new-btn">New job</button>
        </div>
      </div>
      <p id="list-err" class="err"></p>
      <div id="job-list"></div>
    </section>

    <section id="new-view" class="hidden">
      <button type="button" class="ghost" id="back-list">← Jobs</button>
      <h2>New job</h2>
      <p class="muted">Enter the job code. The colour line is read from the first-approval sheet.</p>
      <label>Job code</label>
      <input id="job_id" autocomplete="off" />
      <label>Artwork name</label>
      <input id="file_name" autocomplete="off" />
      <label>Customer</label>
      <input id="customer" autocomplete="off" />
      <p id="new-err" class="err"></p>
      <button type="button" id="save-job">Create job</button>
    </section>

    <section id="job-view" class="hidden">
      <button type="button" class="ghost" id="back-jobs">← Jobs</button>
      <h2 id="job-title"></h2>
      <p id="job-hint" class="muted"></p>
      <div class="stepper" id="stepper"></div>
      <p id="job-err" class="err"></p>
      <div id="stage-panel"></div>
    </section>
  </main>
  <div id="review-modal" class="modal-back" hidden></div>
  <div id="viewer-modal" class="modal-back" hidden></div>
  </div>
  <script>
    const FILE_ACCEPT = ".pdf,.png,.jpg,.jpeg,.webp,application/pdf,image/png,image/jpeg,image/webp";
    const SLOT_COPY = {
      client_artwork: ["Client artwork", "PNG or PDF from the client"],
      approval: ["First approval", "Label-for-approval sheet with colours and plates written on it"],
      vendor_composite: ["Vendor composite", "CGM PDF — ups, cylinder, paper, Col:"],
      separations: ["Separations", "SEP PDF — one page per plate"],
      printout: ["Printout", "Photo after the machine print"],
    };
    const TICK = { issue: "✗", clear: "✓", judge: "!", wait: "—", eye: "◉" };
    const ZOOM_MIN = 0.25;
    const ZOOM_MAX = 8;
    const ZOOM_STEP = 0.25;
    const LOUPE_SIZE = 280;
    const LOUPE_MAG = 3;
    const VIEWER_WIDTH = 2800;
    let currentId = "";
    let snapshot = null;
    let checklist = null;
    let review = null;
    let activeStage = "approval";
    const uploadingRoles = new Set();
    const comparePick = new Set();

    // Cloud login. Local desktop runs (PRINTSAHAJ_REQUIRE_AUTH unset) skip all of this.
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyDc6DYZPYXyeIBRD-amIof8aZs20VEs5CU",
      authDomain: "printsahaj.firebaseapp.com",
      projectId: "printsahaj",
    };
    let authRequired = false;
    let booted = false;

    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const el = document.createElement("script");
        el.src = src;
        el.onload = resolve;
        el.onerror = reject;
        document.head.appendChild(el);
      });
    }

    // Nine languages. Hindi is written in English letters, the way people
    // actually type it, rather than in Devanagari.
    const LANGUAGES = [
      ["en", "English"],
      ["hi", "Hindi (Hinglish)"],
      ["mr", "Marathi — मराठी"],
      ["gu", "Gujarati — ગુજરાતી"],
      ["ta", "Tamil — தமிழ்"],
      ["te", "Telugu — తెలుగు"],
      ["kn", "Kannada — ಕನ್ನಡ"],
      ["bn", "Bengali — বাংলা"],
      ["pa", "Punjabi — ਪੰਜਾਬੀ"],
    ];
    const LANG_KEY = "printverify.lang";

    function currentLang() {
      try {
        return localStorage.getItem(LANG_KEY) || "en";
      } catch (err) {
        return "en";
      }
    }

    function initLangPickers() {
      const chosen = currentLang();
      const picks = document.querySelectorAll("[data-lang-pick]");
      picks.forEach((sel) => {
        sel.innerHTML = LANGUAGES.map(([code, name]) =>
          `<option value="${code}"${code === chosen ? " selected" : ""}>${escapeHtml(name)}</option>`
        ).join("");
        sel.onchange = () => {
          try { localStorage.setItem(LANG_KEY, sel.value); } catch (err) {}
          picks.forEach((other) => { other.value = sel.value; });
          // Notes already on screen were written in the old language; the next
          // check rewrites them.
          const hint = document.getElementById("job-err");
          if (hint) hint.textContent = "Language changed. Press Check this step again to get the notes in it.";
        };
      });
    }

    async function authHeader() {
      if (!authRequired || !window.firebase || !firebase.auth().currentUser) return {};
      const token = await firebase.auth().currentUser.getIdToken();
      return { Authorization: "Bearer " + token };
    }

    async function bootAppOnce() {
      if (booted) return;
      booted = true;
      loadList().then(() => {
        const startJob = new URLSearchParams(location.search).get("job");
        if (startJob) return openJob(startJob);
      }).catch((err) => {
        // On the cloud desk the server is plainly up — the account is simply
        // not on the allow list. Sending that person to start-tool.bat only
        // wastes their time.
        const reason = authRequired
          ? "This account is not cleared for the desk. Ask for the address to be added, then sign in again."
          : "The tool server is not running. Double-click start-tool.bat.";
        document.getElementById("job-list").innerHTML =
          '<div class="card"><p class="err">' + escapeHtml(reason) + "</p>" +
          '<p class="muted">' + escapeHtml(err.message) + "</p></div>";
      });
    }

    async function initAuthGate() {
      initLangPickers();
      let health = {};
      try {
        health = await fetch(API_BASE + "/api/health").then((res) => res.json());
      } catch (err) {
        health = {};
      }
      authRequired = !!health.auth_required;
      // start-tool.bat only exists on a local desk; on the cloud desk that
      // instruction sends people looking for a file they do not have.
      const deskHint = document.getElementById("desk-hint");
      if (deskHint && !authRequired) {
        deskHint.textContent =
          "First approval, then vendor plates, then print. Start with start-tool.bat.";
      }
      if (!authRequired) {
        document.getElementById("app-root").classList.remove("hidden");
        bootAppOnce();
        return;
      }
      await loadScript("https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js");
      await loadScript("https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js");
      firebase.initializeApp(FIREBASE_CONFIG);
      document.getElementById("signout-btn").hidden = false;
      document.getElementById("signout-btn").onclick = () => firebase.auth().signOut();
      document.getElementById("login-btn").onclick = async () => {
        const email = document.getElementById("login-email").value.trim();
        const password = document.getElementById("login-password").value;
        const err = document.getElementById("login-err");
        err.textContent = "";
        try {
          await firebase.auth().signInWithEmailAndPassword(email, password);
        } catch (e) {
          err.textContent = e.message;
        }
      };
      firebase.auth().onAuthStateChanged((user) => {
        if (user) {
          document.getElementById("login-view").classList.add("hidden");
          document.getElementById("app-root").classList.remove("hidden");
          bootAppOnce();
        } else {
          document.getElementById("login-view").classList.remove("hidden");
          document.getElementById("app-root").classList.add("hidden");
        }
      });
    }

    function show(id) {
      document.querySelectorAll("main > section").forEach((el) => el.classList.add("hidden"));
      document.getElementById(id).classList.remove("hidden");
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // Firebase Hosting drops a proxied request after 60 seconds and a full
    // plate check takes longer than that, so when the desk is served from the
    // custom domain it talks to Cloud Run directly instead of through the
    // proxy. Locally and on *.run.app this stays empty, i.e. same origin.
    const CLOUD_API_BASE = "https://artwork-verification-485728415345.asia-south1.run.app";
    const API_BASE = /^(localhost|127\.0\.0\.1)$/.test(location.hostname)
      || location.hostname.endsWith(".run.app")
      ? ""
      : CLOUD_API_BASE;

    async function j(path, opts) {
      opts = opts || {};
      const headers = Object.assign({}, opts.headers || {}, await authHeader());
      const res = await fetch(API_BASE + path, Object.assign({}, opts, { headers }));
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      return data;
    }

    function previewUrl(role, page, width) {
      return "/api/jobs/" + encodeURIComponent(currentId) + "/files/" +
        encodeURIComponent(role) + "/preview?page=" + page +
        (width ? "&width=" + width : "") + "&v=" + Date.now();
    }

    // An <img src> carries no Authorization header, so with the login gate on
    // every preview came back 401. Fetch the bytes with the token instead and
    // hand the image a blob it can show.
    async function fillPreview(img, url) {
      try {
        const res = await fetch(API_BASE + url, { headers: await authHeader() });
        if (!res.ok) throw new Error("Preview failed (" + res.status + ")");
        if (img.dataset.blobUrl) URL.revokeObjectURL(img.dataset.blobUrl);
        const blobUrl = URL.createObjectURL(await res.blob());
        img.dataset.blobUrl = blobUrl;
        img.src = blobUrl;
      } catch (err) {
        img.alt = err.message;
      }
    }

    /** Load every <img data-preview="..."> inside *root* through fillPreview. */
    function hydratePreviews(root) {
      (root || document).querySelectorAll("img[data-preview]").forEach((img) => {
        const url = img.dataset.preview;
        delete img.dataset.preview;
        fillPreview(img, url);
      });
    }

    function stageLocked(stageId, defs, checked) {
      const order = defs.map((d) => d.stage_id);
      const idx = order.indexOf(stageId);
      if (idx <= 0) return false;
      return !checked.includes(order[idx - 1]);
    }

    function applySavedReview(saved) {
      if (!saved) {
        checklist = null;
        review = null;
        return;
      }
      checklist = saved.checklist || null;
      review = saved.review || null;
    }

    async function loadList() {
      const data = await j("/api/jobs");
      const box = document.getElementById("job-list");
      if (!data.jobs.length) {
        box.innerHTML = '<p class="muted">No jobs yet. Create a new job and upload fresh files.</p>';
        return;
      }
      box.innerHTML = data.jobs.map((job) => (
        `<div class="card job-card" data-open="${escapeHtml(job.job_id)}"><div class="row">
          <div><strong>${escapeHtml(job.job_id)}</strong><div class="muted">${escapeHtml(job.file_name)} · ${escapeHtml(job.customer || "")}</div></div>
          <span class="open-hint">Open →</span>
        </div></div>`
      )).join("");
      box.querySelectorAll("[data-open]").forEach((el) => {
        el.onclick = () => openJob(el.getAttribute("data-open"));
      });
    }

    async function openJob(id) {
      currentId = id;
      snapshot = await j("/api/jobs/" + encodeURIComponent(id));
      document.getElementById("job-title").textContent = id + "  ·  " + (snapshot.job.file_name || "");
      applySavedReview(snapshot.last_review);
      const checked = (checklist && checklist.stages_checked) || snapshot.stages_checked || [];
      activeStage = checked.includes("print") ? "print" : checked.includes("vendor") ? "vendor" : "approval";
      renderJob();
      show("job-view");
    }

    function renderJob() {
      const defs = snapshot.stage_defs || [];
      const checked = (checklist && checklist.stages_checked) || snapshot.stages_checked || [];
      const stepper = document.getElementById("stepper");
      stepper.innerHTML = defs.map((def) => {
        const locked = stageLocked(def.stage_id, defs, checked);
        const on = def.stage_id === activeStage ? " active" : "";
        const lock = locked ? " locked" : "";
        // A checked step keeps its tick even while it is the active one.
        const done = checked.includes(def.stage_id) ? " done" : "";
        const lockHint = locked
          ? (def.stage_id === "print"
            ? "Check step 2 (vendor plates) first"
            : "Check the previous step first")
          : def.hint;
        return `<button type="button" class="step${on}${lock}${done}" data-stage="${def.stage_id}">
          ${escapeHtml(def.title)}<small>${escapeHtml(lockHint)}</small>
        </button>`;
      }).join("");
      stepper.querySelectorAll("[data-stage]").forEach((btn) => {
        btn.onclick = () => {
          const id = btn.getAttribute("data-stage");
          if (stageLocked(id, defs, checked)) {
            document.getElementById("job-err").textContent =
              id === "print"
                ? "Check step 2 first — then step 3 (printout) unlocks."
                : "Check the previous step first.";
            return;
          }
          document.getElementById("job-err").textContent = "";
          activeStage = id;
          renderJob();
        };
      });
      const def = defs.find((d) => d.stage_id === activeStage) || defs[0];
      const geminiHint = snapshot.gemini_ok
        ? "Gemini: ON — Google accepted the key."
        : snapshot.gemini
          ? "Gemini: key is present but Google did not accept it. Check gemini-key.txt."
          : "Gemini: OFF — paste the key in gemini-key.txt next to start-tool.bat, save, restart the black window.";
      document.getElementById("job-hint").textContent = (def ? def.hint + " " : "") + geminiHint;
      document.getElementById("stage-panel").innerHTML = renderStage(def, checked, defs);
      hydratePreviews(document.getElementById("stage-panel"));
      bindStage(def, defs, checked);
    }

    function slotCard(role) {
      const info = (snapshot.slots || {})[role];
      const copy = SLOT_COPY[role] || [role, ""];
      const have = info && info.name;
      const pages = info && info.pages ? Number(info.pages) : 1;
      const uploading = uploadingRoles.has(role);
      const checked = comparePick.has(role) ? " checked" : "";
      const preview = uploading
        ? `<p class="uploading">Uploading…</p>`
        : have ? `
        <label class="compare-pick">
          <input type="checkbox" data-compare="${role}"${checked} />
          Compare
        </label>
        <img class="preview" data-role="${role}" data-page="1" data-pages="${pages}"
          data-preview="${previewUrl(role, 1)}" alt="${copy[0]} preview" />
        <p class="muted">${escapeHtml(info.name)} · ${escapeHtml(info.kind)}${pages > 1 ? " · " + pages + " pages" : ""}</p>
        ${pages > 1 ? `<div class="preview-nav">
          <button type="button" class="ghost" data-preview-role="${role}" data-delta="-1">Prev</button>
          <span class="muted" data-page-label="${role}">Page 1 / ${pages}</span>
          <button type="button" class="ghost" data-preview-role="${role}" data-delta="1">Next</button>
        </div>` : ""}` : `<p class="slot-empty">${escapeHtml(copy[1])}</p>`;
      return `<div class="card">
        <div class="row">
          <div><strong>${escapeHtml(copy[0])}</strong></div>
          <div class="pick-wrap">
            <input class="file-pick" type="file" accept="${FILE_ACCEPT}" data-role="${role}" />
            <button type="button" class="ghost" data-pick="${role}">${have ? "Replace" : "Upload"}</button>
          </div>
        </div>
        ${preview}
      </div>`;
    }

    function reviewItems(stageId) {
      const rows = ((review && review.stages) || []).find((s) => s.stage_id === stageId);
      return rows && rows.checked ? rows.items : [];
    }

    // The server marks a line that disagrees with the artwork with "!! ".
    // Escape first, then colour, so nothing in the label's own text can
    // become markup.
    const BAD_LINE_MARKER = "!! ";

    function renderTextBlock(text) {
      return String(text).split("\n").map((line) => {
        if (line.startsWith(BAD_LINE_MARKER)) {
          return '<span class="bad">' + escapeHtml(line.slice(BAD_LINE_MARKER.length)) + "</span>";
        }
        return escapeHtml(line);
      }).join("\n");
    }

    /** Review rows. *withText* adds the full matter, which only the detail
     *  view shows — on the main screen it would bury everything else. */
    function renderReviewRows(items, withText) {
      if (!items.length) {
        return '<p class="muted">Press Check this step for a point-wise review.</p>';
      }
      return items.map((item) => {
        const block = withText && item.text_block
          ? `<div class="text-block">${renderTextBlock(item.text_block)}</div>`
          : "";
        return `
        <div class="review-row ${item.state}">
          <div class="tick ${item.state}" title="${escapeHtml(item.state)}">${TICK[item.state] || "—"}</div>
          <div><strong>${escapeHtml(item.title)}</strong><div class="muted">${escapeHtml(item.detail)}</div>${block}</div>
        </div>`;
      }).join("");
    }

    function renderStage(def, checked, defs) {
      if (!def) return "";
      const items = reviewItems(def.stage_id);
      const next = defs[defs.findIndex((d) => d.stage_id === def.stage_id) + 1];
      const nextOpen = next && !stageLocked(next.stage_id, defs, checked);
      return `
        <div class="grid">${def.slots.map(slotCard).join("")}</div>
        <div class="row" style="margin:16px 0">
          <div>
            <button type="button" id="check-btn">Check this step</button>
            ${items.length ? '<button type="button" class="ghost" id="detail-btn">See review detail</button>' : ""}
          </div>
          ${nextOpen ? `<button type="button" id="next-btn">Go to ${escapeHtml(next.title)}</button>` : `<span class="muted">${next ? "The next step unlocks after this one is checked." : ""}</span>`}
        </div>
        <div class="card"><strong>Review</strong>${renderReviewRows(items)}
          ${snapshot && snapshot.gemini ? "" : '<p class="muted">Image wording, bowl place, logo place, batch and MRP on a PNG need a Gemini key. Put it in gemini-key.txt next to start-tool.bat, restart the black window, then Check this step again. Or compare the two previews side by side.</p>'}
        </div>
        ${def.stage_id === "print" ? `<div class="card">
          <label>Remark</label>
          <input id="remark-by" placeholder="Name" />
          <textarea id="remark-text" rows="3" placeholder="What looks right or wrong"></textarea>
          <button type="button" class="ghost" id="save-remark">Save remark</button>
        </div>` : ""}
      `;
    }

    function openReviewDetail(def) {
      const rows = ((review && review.stages) || []).find((s) => s.stage_id === def.stage_id);
      if (!rows || !rows.checked) return;
        const skipped = (rows.not_checked || []).map((line) => `<li>${escapeHtml(line)}</li>`).join("");
      const box = document.getElementById("review-modal");
      box.className = "modal-back is-open";
      box.hidden = false;
      box.innerHTML = `<div class="modal">
        <div class="row">
          <strong>${escapeHtml(rows.title)} — review detail</strong>
          <button type="button" class="ghost" id="close-review">Close</button>
        </div>
        <p class="muted">Green tick = nothing wrong found here. Red = a definite problem only. Amber = please look yourself. This is not a sign-off.</p>
        ${renderReviewRows(rows.items, true)}
        <div class="card">
          <strong>What this step did not check</strong>
          <ul class="muted">${skipped}</ul>
        </div>
      </div>`;
      document.getElementById("close-review").onclick = closeReviewDetail;
      box.onclick = (event) => { if (event.target === box) closeReviewDetail(); };
    }

    function closeReviewDetail() {
      const box = document.getElementById("review-modal");
      box.className = "modal-back";
      box.hidden = true;
      box.innerHTML = "";
      box.onclick = null;
    }

    function bindStage(def, defs, checked) {
      document.querySelectorAll("[data-pick]").forEach((btn) => {
        btn.onclick = (event) => {
          event.preventDefault();
          const role = btn.getAttribute("data-pick");
          const input = document.querySelector('input.file-pick[data-role="' + role + '"]');
          if (input) input.click();
        };
      });
      document.querySelectorAll("input.file-pick[data-role]").forEach((input) => {
        input.onchange = () => {
          const file = input.files && input.files[0];
          input.value = "";
          upload(input.getAttribute("data-role"), file);
        };
      });
      document.querySelectorAll("[data-preview-role]").forEach((btn) => {
        btn.onclick = () => shiftPreview(btn.getAttribute("data-preview-role"), Number(btn.getAttribute("data-delta")));
      });
      document.querySelectorAll("input[data-compare]").forEach((box) => {
        box.onchange = () => {
          const role = box.getAttribute("data-compare");
          if (box.checked) comparePick.add(role);
          else comparePick.delete(role);
        };
      });
      document.querySelectorAll("img.preview").forEach((img) => {
        img.onclick = () => {
          const role = img.getAttribute("data-role");
          const selected = [...document.querySelectorAll("input[data-compare]:checked")]
            .map((el) => el.getAttribute("data-compare"));
          if (selected.length >= 2 && selected.includes(role)) {
            openViewer(selected);
          } else {
            openViewer([role]);
          }
        };
      });
      const checkBtn = document.getElementById("check-btn");
      if (checkBtn) checkBtn.onclick = () => checkStage(def.stage_id, checkBtn);
      const detailBtn = document.getElementById("detail-btn");
      if (detailBtn) detailBtn.onclick = () => openReviewDetail(def);
      const nextBtn = document.getElementById("next-btn");
      if (nextBtn) nextBtn.onclick = () => {
        const next = defs[defs.findIndex((d) => d.stage_id === def.stage_id) + 1];
        if (!next || stageLocked(next.stage_id, defs, checked)) return;
        activeStage = next.stage_id;
        renderJob();
      };
      const saveRemark = document.getElementById("save-remark");
      if (saveRemark) saveRemark.onclick = async () => {
        await j("/api/jobs/" + encodeURIComponent(currentId) + "/remarks", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            remark: document.getElementById("remark-text").value,
            by: document.getElementById("remark-by").value,
          }),
        });
        document.getElementById("remark-text").value = "";
      };
    }

    function shiftPreview(role, delta) {
      const img = document.querySelector('img.preview[data-role="' + role + '"]');
      if (!img) return;
      const max = Number(img.getAttribute("data-pages") || "1");
      let page = Number(img.getAttribute("data-page") || "1") + delta;
      if (page < 1) page = max;
      if (page > max) page = 1;
      img.setAttribute("data-page", String(page));
      fillPreview(img, previewUrl(role, page));
      const label = document.querySelector('[data-page-label="' + role + '"]');
      if (label) label.textContent = "Page " + page + " / " + max;
    }

    async function upload(role, file) {
      if (!file) return;
      document.getElementById("job-err").textContent = "";
      uploadingRoles.add(role);
      renderJob();
      try {
        const body = new FormData();
        body.append("role", role);
        body.append("file", file, file.name);
        const res = await fetch(API_BASE + "/api/jobs/" + encodeURIComponent(currentId) + "/files", { method: "POST", body, headers: await authHeader() });
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        snapshot = await j("/api/jobs/" + encodeURIComponent(currentId));
      } catch (err) {
        document.getElementById("job-err").textContent = err.message;
      } finally {
        uploadingRoles.delete(role);
        renderJob();
      }
    }

    function viewerPane(role) {
      const info = (snapshot.slots || {})[role] || {};
      const copy = (SLOT_COPY[role] || [role])[0];
      const pages = info.pages ? Number(info.pages) : 1;
      const page = 1;
      return `<div class="viewer-pane" data-viewer-role="${role}">
        <div class="viewer-toolbar">
          <strong>${escapeHtml(copy)}</strong>
          <button type="button" class="ghost" data-zoom="${role}" data-zoom-delta="-1">Zoom out</button>
          <span class="muted" data-zoom-label="${role}">100%</span>
          <button type="button" class="ghost" data-zoom="${role}" data-zoom-delta="1">Zoom in</button>
          <button type="button" class="ghost loupe-btn" data-loupe="${role}" title="Magnifying glass">🔍 Magnifier</button>
          ${pages > 1 ? `<button type="button" class="ghost" data-viewer-page="${role}" data-delta="-1">Prev</button>
            <span class="muted" data-viewer-page-label="${role}">Page 1 / ${pages}</span>
            <button type="button" class="ghost" data-viewer-page="${role}" data-delta="1">Next</button>` : ""}
        </div>
        <div class="viewer-stage" data-stage="${role}">
          <img class="viewer-img" data-viewer-img="${role}" data-page="${page}" data-pages="${pages}"
            data-preview="${previewUrl(role, page, VIEWER_WIDTH)}" alt="${escapeHtml(copy)} full preview" />
          <div class="loupe hidden" data-loupe-lens="${role}"></div>
        </div>
      </div>`;
    }

    function openViewer(roles) {
      const box = document.getElementById("viewer-modal");
      const many = roles.length > 1;
      box.className = "modal-back is-open viewer-open";
      box.hidden = false;
      box.innerHTML = `<div class="modal viewer-modal">
        <div class="row">
          <strong>${many ? "Compare" : "Full preview"}</strong>
          <button type="button" class="ghost" id="close-viewer">Close</button>
        </div>
        <p class="muted">${many ? "Both files, side by side. Zoom in until the type is readable, or use the magnifying glass." : "Zoom in until the type is readable, or use the magnifying glass."}</p>
        <div class="viewer-grid${many ? "" : " one"}">${roles.map(viewerPane).join("")}</div>
      </div>`;
      hydratePreviews(box);
      document.getElementById("close-viewer").onclick = closeViewer;
      box.onclick = (event) => { if (event.target === box) closeViewer(); };
      roles.forEach(bindViewerPane);
    }

    function closeViewer() {
      const box = document.getElementById("viewer-modal");
      box.className = "modal-back";
      box.hidden = true;
      box.innerHTML = "";
      box.onclick = null;
    }

    function bindViewerPane(role) {
      let scale = 1;
      const img = document.querySelector('[data-viewer-img="' + role + '"]');
      const label = document.querySelector('[data-zoom-label="' + role + '"]');
      const applyZoom = () => {
        img.style.zoom = String(scale);
        if (label) label.textContent = Math.round(scale * 100) + "%";
      };
      document.querySelectorAll('[data-zoom="' + role + '"]').forEach((btn) => {
        btn.onclick = () => {
          const delta = Number(btn.getAttribute("data-zoom-delta"));
          scale = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, scale + delta * ZOOM_STEP * 4));
          applyZoom();
        };
      });
      img.addEventListener("wheel", (event) => {
        if (!event.ctrlKey && !event.metaKey) return;
        event.preventDefault();
        scale = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, scale + (event.deltaY < 0 ? ZOOM_STEP : -ZOOM_STEP)));
        applyZoom();
      }, { passive: false });
      document.querySelectorAll('[data-viewer-page="' + role + '"]').forEach((btn) => {
        btn.onclick = () => {
          const max = Number(img.getAttribute("data-pages") || "1");
          let page = Number(img.getAttribute("data-page") || "1") + Number(btn.getAttribute("data-delta"));
          if (page < 1) page = max;
          if (page > max) page = 1;
          img.setAttribute("data-page", String(page));
          fillPreview(img, previewUrl(role, page, VIEWER_WIDTH));
          const pageLabel = document.querySelector('[data-viewer-page-label="' + role + '"]');
          if (pageLabel) pageLabel.textContent = "Page " + page + " / " + max;
        };
      });
      const stage = document.querySelector('[data-stage="' + role + '"]');
      const lens = document.querySelector('[data-loupe-lens="' + role + '"]');
      const loupeBtn = document.querySelector('[data-loupe="' + role + '"]');
      let loupeOn = false;
      loupeBtn.onclick = () => {
        loupeOn = !loupeOn;
        loupeBtn.classList.toggle("active", loupeOn);
        if (!loupeOn) lens.classList.add("hidden");
      };
      stage.onmousemove = (event) => {
        if (!loupeOn) return;
        const rect = img.getBoundingClientRect();
        if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) {
          lens.classList.add("hidden");
          return;
        }
        lens.classList.remove("hidden");
        const stageRect = stage.getBoundingClientRect();
        const x = event.clientX - rect.left;
        const y = event.clientY - rect.top;
        lens.style.left = (event.clientX - stageRect.left - LOUPE_SIZE / 2 + stage.scrollLeft) + "px";
        lens.style.top = (event.clientY - stageRect.top - LOUPE_SIZE / 2 + stage.scrollTop) + "px";
        const natW = img.naturalWidth || rect.width;
        const natH = img.naturalHeight || rect.height;
        const sx = natW / rect.width;
        const sy = natH / rect.height;
        lens.style.backgroundImage = "url(" + img.src + ")";
        lens.style.backgroundSize = (natW * LOUPE_MAG) + "px " + (natH * LOUPE_MAG) + "px";
        lens.style.backgroundPosition =
          (-(x * sx * LOUPE_MAG - LOUPE_SIZE / 2)) + "px " +
          (-(y * sy * LOUPE_MAG - LOUPE_SIZE / 2)) + "px";
      };
      stage.onmouseleave = () => lens.classList.add("hidden");
    }

    async function checkStage(stage, button) {
      try {
        document.getElementById("job-err").textContent = "";
        if (button) {
          button.disabled = true;
          button.textContent = "Checking…";
        }
        const report = await j("/api/jobs/" + encodeURIComponent(currentId) + "/check", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ stage, lang: currentLang() }),
        });
        checklist = report.checklist;
        review = report.review;
        snapshot = await j("/api/jobs/" + encodeURIComponent(currentId));
        snapshot.stages_checked = report.stages_checked || snapshot.stages_checked;
        renderJob();
      } catch (err) {
        document.getElementById("job-err").textContent = err.message;
        if (button) {
          button.disabled = false;
          button.textContent = "Check this step";
        }
      }
    }

    document.getElementById("new-btn").onclick = () => { document.getElementById("new-err").textContent = ""; show("new-view"); };
    document.getElementById("back-list").onclick = () => { show("list-view"); loadList(); };
    document.getElementById("back-jobs").onclick = () => { show("list-view"); loadList(); };
    document.getElementById("clear-btn").onclick = async () => {
      if (!window.confirm("Delete every job on this computer? Uploaded files will be removed.")) return;
      document.getElementById("list-err").textContent = "";
      try {
        await j("/api/jobs", { method: "DELETE" });
        currentId = "";
        snapshot = null;
        checklist = null;
        review = null;
        await loadList();
      } catch (err) {
        document.getElementById("list-err").textContent = err.message;
      }
    };

    document.getElementById("save-job").onclick = async () => {
      try {
        const payload = {
          job_id: document.getElementById("job_id").value.trim(),
          file_name: document.getElementById("file_name").value.trim(),
          customer: document.getElementById("customer").value.trim(),
          print_type: "Flexo",
        };
        await j("/api/jobs", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
        openJob(payload.job_id);
      } catch (err) {
        document.getElementById("new-err").textContent = err.message;
      }
    };

    initAuthGate();
  </script>
</body>
</html>
