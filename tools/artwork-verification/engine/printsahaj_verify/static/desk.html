<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PrintSahaj · Artwork Verification</title>
  <style>
    :root {
      --paper: #f3efe6;
      --ink: #16120c;
      --muted: #6d6458;
      --line: #ddd4c6;
      --gold: #9a7b2f;
      --card: #fffdf8;
      --issue: #8f2d1f;
      --clear: #2c6a4a;
      --judge: #8a5a12;
      --wait: #8a8378;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Iowan Old Style", Palatino, Georgia, serif;
    }
    header {
      padding: 28px 32px 20px;
      border-bottom: 1px solid var(--line);
      background: #faf7f0;
    }
    header p { margin: 8px 0 0; color: var(--muted); font-size: 14px; font-family: "Segoe UI", system-ui, sans-serif; }
    h1 { margin: 0; font-size: 28px; letter-spacing: -0.03em; font-weight: 600; }
    .kicker { font-family: "Segoe UI", system-ui, sans-serif; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); }
    main { max-width: 980px; margin: 0 auto; padding: 28px 24px 80px; }
    button, .btn {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--ink);
      color: #f7f1e6;
      border: 0;
      border-radius: 999px;
      padding: 10px 18px;
      cursor: pointer;
      font-size: 14px;
    }
    button.ghost, .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    input, textarea {
      width: 100%;
      padding: 10px 12px;
      margin: 6px 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font: 15px "Segoe UI", system-ui, sans-serif;
      background: #fff;
    }
    label { font-family: "Segoe UI", system-ui, sans-serif; font-size: 12px; color: var(--muted); letter-spacing: 0.04em; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px 20px;
      margin: 12px 0;
    }
    .row { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
    .err { color: var(--issue); font-family: "Segoe UI", system-ui, sans-serif; }
    .muted { color: var(--muted); font-size: 13px; font-family: "Segoe UI", system-ui, sans-serif; }
    .hidden { display: none; }
    .preview { max-width: 100%; max-height: 280px; border: 1px solid var(--line); border-radius: 10px; background: #fff; display: block; }
    .preview-nav { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
    .stepper { display: flex; gap: 8px; margin: 8px 0 24px; font-family: "Segoe UI", system-ui, sans-serif; }
    .step {
      flex: 1;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--card);
      cursor: pointer;
      text-align: left;
    }
    .step.active { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
    .step.locked { opacity: 0.5; cursor: not-allowed; }
    .step small { display: block; color: var(--muted); margin-top: 4px; }
    .mark { font-family: "Segoe UI", system-ui, sans-serif; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
    .mark.issue { color: var(--issue); }
    .mark.clear { color: var(--clear); }
    .mark.judge { color: var(--judge); }
    .mark.wait { color: var(--wait); }
    .check-row {
      display: grid;
      grid-template-columns: 88px 1fr;
      gap: 12px;
      padding: 10px 0;
      border-top: 1px solid var(--line);
      font-family: "Segoe UI", system-ui, sans-serif;
      font-size: 14px;
    }
    .overall {
      position: sticky;
      bottom: 0;
      margin: 28px -24px -80px;
      padding: 18px 24px 28px;
      background: var(--ink);
      color: #f7f1e6;
      font-size: 22px;
      letter-spacing: -0.02em;
    }
    .overall span { display: block; font-family: "Segoe UI", system-ui, sans-serif; font-size: 13px; color: #cfc6b6; margin-top: 4px; }
    .job-card { cursor: pointer; }
    .job-card:hover { border-color: var(--gold); }
  </style>
</head>
<body>
  <header>
    <div class="kicker">PrintSahaj</div>
    <h1>Artwork Verification</h1>
    <p>Pehle approval, phir vendor plates, phir print. Ek saath nahi. Yeh website nahi hai — pehle start-tool.bat.</p>
  </header>
  <main>
    <section id="list-view">
      <div class="row">
        <strong>Jobs</strong>
        <button type="button" id="new-btn">Naya job</button>
      </div>
      <div id="job-list"></div>
    </section>

    <section id="new-view" class="hidden">
      <button type="button" class="ghost" id="back-list">← Jobs</button>
      <h2>Naya job</h2>
      <p class="muted">Job code aap daalo. Colour line first-approval sheet se padhi jayegi.</p>
      <label>Job code</label>
      <input id="job_id" autocomplete="off" />
      <label>Artwork ka naam</label>
      <input id="file_name" autocomplete="off" />
      <label>Customer</label>
      <input id="customer" autocomplete="off" />
      <p id="new-err" class="err"></p>
      <button type="button" id="save-job">Job banao</button>
    </section>

    <section id="job-view" class="hidden">
      <button type="button" class="ghost" id="back-jobs">← Jobs</button>
      <h2 id="job-title"></h2>
      <p id="job-hint" class="muted"></p>
      <div class="stepper" id="stepper"></div>
      <p id="job-err" class="err"></p>
      <div id="stage-panel"></div>
      <div id="overall-bar" class="hidden"></div>
    </section>
  </main>
  <script>
    const FILE_ACCEPT = ".pdf,.png,.jpg,.jpeg,.webp,application/pdf,image/png,image/jpeg,image/webp";
    const SLOT_COPY = {
      client_artwork: ["Client artwork", "PNG / PDF — jo client ne bheja"],
      approval: ["First approval", "Label for approval — rang aur plate yahin likhe hote hain"],
      vendor_composite: ["Vendor composite", "CGM… PDF — kitne label, cylinder, paper, Col:"],
      separations: ["Separations", "SEP… PDF — har plate ek page"],
      printout: ["Printout", "Machine print ke baad photo"],
    };
    const MARK = { issue: "Galat", clear: "Theek", judge: "Dekho", wait: "—" };
    let currentId = "";
    let snapshot = null;
    let checklist = null;
    let activeStage = "approval";

    function show(id) {
      document.querySelectorAll("main > section").forEach((el) => el.classList.add("hidden"));
      document.getElementById(id).classList.remove("hidden");
    }

    async function j(path, opts) {
      const res = await fetch(path, opts);
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      return data;
    }

    function guessRole(name) {
      const n = name.toLowerCase();
      if (n.startsWith("sep") || n.includes("separat")) return "separations";
      if (n.includes("approval")) return "approval";
      if (/cgm\d{4}/i.test(n)) return "vendor_composite";
      if (/\.(png|jpe?g|webp)$/.test(n)) return "client_artwork";
      return null;
    }

    function previewUrl(role, page) {
      return "/api/jobs/" + encodeURIComponent(currentId) + "/files/" + encodeURIComponent(role) + "/preview?page=" + page;
    }

    function stageLocked(stageId, defs, checked) {
      const order = defs.map((d) => d.stage_id);
      const idx = order.indexOf(stageId);
      if (idx <= 0) return false;
      return !checked.includes(order[idx - 1]);
    }

    async function loadList() {
      const data = await j("/api/jobs");
      const box = document.getElementById("job-list");
      if (!data.jobs.length) {
        box.innerHTML = '<p class="muted">Abhi koi job nahi.</p>';
        return;
      }
      box.innerHTML = data.jobs.map((job) => (
        `<div class="card job-card" data-open="${job.job_id}"><div class="row">
          <div><strong>${job.job_id}</strong><div class="muted">${job.file_name} · ${job.customer || ""}</div></div>
          <span class="muted">Kholo</span>
        </div></div>`
      )).join("");
      box.querySelectorAll("[data-open]").forEach((el) => {
        el.onclick = () => openJob(el.getAttribute("data-open"));
      });
    }

    async function openJob(id) {
      currentId = id;
      snapshot = await j("/api/jobs/" + encodeURIComponent(id));
      document.getElementById("job-title").textContent = id + "  ·  " + (snapshot.job.file_name || "");
      activeStage = "approval";
      checklist = null;
      renderJob();
      show("job-view");
    }

    function renderJob() {
      const defs = snapshot.stage_defs || [];
      const checked = (checklist && checklist.stages_checked) || snapshot.stages_checked || [];
      const stepper = document.getElementById("stepper");
      stepper.innerHTML = defs.map((def) => {
        const locked = stageLocked(def.stage_id, defs, checked);
        const on = def.stage_id === activeStage ? " active" : "";
        const lock = locked ? " locked" : "";
        return `<button type="button" class="step${on}${lock}" data-stage="${def.stage_id}">
          ${def.title}<small>${locked ? "Pehle pichla step" : def.hint}</small>
        </button>`;
      }).join("");
      stepper.querySelectorAll("[data-stage]").forEach((btn) => {
        btn.onclick = () => {
          const id = btn.getAttribute("data-stage");
          if (stageLocked(id, defs, checked)) return;
          activeStage = id;
          renderJob();
        };
      });
      const def = defs.find((d) => d.stage_id === activeStage) || defs[0];
      document.getElementById("job-hint").textContent = def ? def.hint : "";
      document.getElementById("stage-panel").innerHTML = renderStage(def, checked);
      bindStage(def);
      renderOverall();
    }

    function slotCard(role) {
      const info = (snapshot.slots || {})[role];
      const copy = SLOT_COPY[role] || [role, ""];
      const have = info && info.name;
      const pages = info && info.pages ? Number(info.pages) : 1;
      const preview = have ? `
        <img class="preview" data-role="${role}" data-page="1" data-pages="${pages}"
          src="${previewUrl(role, 1)}" alt="${copy[0]} preview" />
        <p class="muted">${info.name} · ${info.kind}${pages > 1 ? " · " + pages + " pages" : ""}</p>
        ${pages > 1 ? `<div class="preview-nav">
          <button type="button" class="ghost" data-preview-role="${role}" data-delta="-1">Pehle</button>
          <span class="muted" data-page-label="${role}">Page 1 / ${pages}</span>
          <button type="button" class="ghost" data-preview-role="${role}" data-delta="1">Aage</button>
        </div>` : ""}` : `<p class="muted">${copy[1]}</p>`;
      return `<div class="card">
        <div class="row">
          <div><strong>${copy[0]}</strong></div>
          <label class="btn ghost">${have ? "Badlo" : "Upload"}
            <input type="file" accept="${FILE_ACCEPT}" data-role="${role}" hidden />
          </label>
        </div>
        ${preview}
      </div>`;
    }

    function renderStage(def) {
      if (!def) return "";
      const rows = ((checklist && checklist.stages) || []).find((s) => s.stage_id === def.stage_id);
      const list = rows && rows.checked ? rows.items.map((item) => `
        <div class="check-row">
          <div class="mark ${item.state}">${MARK[item.state] || item.state}</div>
          <div><strong>${item.title}</strong><div class="muted">${item.detail}</div></div>
        </div>`).join("") : '<p class="muted">Is step ko check karo — lambi report nahi, chhoti list.</p>';
      return `
        <div class="grid">${def.slots.map(slotCard).join("")}</div>
        <div class="card">
          <label>Ya files yahan drop karo — naam se slot soch lenge (SEP, approval, CGM…)</label>
          <input id="multi-files" type="file" accept="${FILE_ACCEPT}" multiple />
        </div>
        <div class="row" style="margin:16px 0">
          <button type="button" id="check-btn">Is step ko check karo</button>
          <span class="muted">Phir agla step khulega.</span>
        </div>
        <div class="card"><strong>Checklist</strong>${list}</div>
        ${def.stage_id === "print" ? `<div class="card">
          <label>Remark</label>
          <input id="remark-by" placeholder="Naam" />
          <textarea id="remark-text" rows="3" placeholder="Jo theek / jo galat"></textarea>
          <button type="button" class="ghost" id="save-remark">Remark save karo</button>
        </div>` : ""}
      `;
    }

    function bindStage(def) {
      document.querySelectorAll("input[type=file][data-role]").forEach((input) => {
        input.onchange = () => upload(input.getAttribute("data-role"), input.files[0]);
      });
      const multi = document.getElementById("multi-files");
      if (multi) multi.onchange = async () => {
        for (const file of multi.files) {
          const role = guessRole(file.name);
          if (!role) {
            document.getElementById("job-err").textContent = file.name + " ka slot nahi samajh aaya. Upload button se choose karo.";
            continue;
          }
          await upload(role, file);
        }
      };
      document.querySelectorAll("[data-preview-role]").forEach((btn) => {
        btn.onclick = () => shiftPreview(btn.getAttribute("data-preview-role"), Number(btn.getAttribute("data-delta")));
      });
      const checkBtn = document.getElementById("check-btn");
      if (checkBtn) checkBtn.onclick = () => checkStage(def.stage_id);
      const saveRemark = document.getElementById("save-remark");
      if (saveRemark) saveRemark.onclick = async () => {
        await j("/api/jobs/" + encodeURIComponent(currentId) + "/remarks", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            remark: document.getElementById("remark-text").value,
            by: document.getElementById("remark-by").value,
          }),
        });
        document.getElementById("remark-text").value = "";
      };
    }

    function shiftPreview(role, delta) {
      const img = document.querySelector('img.preview[data-role="' + role + '"]');
      if (!img) return;
      const max = Number(img.getAttribute("data-pages") || "1");
      let page = Number(img.getAttribute("data-page") || "1") + delta;
      if (page < 1) page = max;
      if (page > max) page = 1;
      img.setAttribute("data-page", String(page));
      img.src = previewUrl(role, page);
      const label = document.querySelector('[data-page-label="' + role + '"]');
      if (label) label.textContent = "Page " + page + " / " + max;
    }

    async function upload(role, file) {
      if (!file) return;
      const body = new FormData();
      body.append("role", role);
      body.append("file", file, file.name);
      const res = await fetch("/api/jobs/" + encodeURIComponent(currentId) + "/files", { method: "POST", body });
      const data = await res.json();
      if (data.error) {
        document.getElementById("job-err").textContent = data.error;
        return;
      }
      snapshot = await j("/api/jobs/" + encodeURIComponent(currentId));
      renderJob();
    }

    async function checkStage(stage) {
      try {
        document.getElementById("job-err").textContent = "";
        const report = await j("/api/jobs/" + encodeURIComponent(currentId) + "/check", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ stage }),
        });
        checklist = report.checklist;
        snapshot = await j("/api/jobs/" + encodeURIComponent(currentId));
        renderJob();
      } catch (err) {
        document.getElementById("job-err").textContent = err.message;
      }
    }

    function renderOverall() {
      const bar = document.getElementById("overall-bar");
      if (!checklist) {
        bar.className = "hidden";
        bar.innerHTML = "";
        return;
      }
      bar.className = "overall";
      bar.innerHTML = checklist.overall_label +
        '<span>Yeh tool faisla nahi leta. Aakhri signature aapka.</span>';
    }

    document.getElementById("new-btn").onclick = () => { document.getElementById("new-err").textContent = ""; show("new-view"); };
    document.getElementById("back-list").onclick = () => { show("list-view"); loadList(); };
    document.getElementById("back-jobs").onclick = () => { show("list-view"); loadList(); };

    document.getElementById("save-job").onclick = async () => {
      try {
        const payload = {
          job_id: document.getElementById("job_id").value.trim(),
          file_name: document.getElementById("file_name").value.trim(),
          customer: document.getElementById("customer").value.trim(),
          print_type: "Flexo",
        };
        await j("/api/jobs", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
        openJob(payload.job_id);
      } catch (err) {
        document.getElementById("new-err").textContent = err.message;
      }
    };

    loadList().catch((err) => {
      document.getElementById("job-list").innerHTML =
        '<div class="card"><p class="err">Tool ka server nahi mil raha. start-tool.bat chalao.</p>' +
        '<p class="muted">' + err.message + "</p></div>";
    });
  </script>
</body>
</html>
